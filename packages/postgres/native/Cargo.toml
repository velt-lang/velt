[package]
name = "velt_postgres_native"
version = "0.1.0"
edition = "2021"
publish = false
description = "The postgres package's native library: a PostgreSQL client over tokio-postgres and rustls"

[lib]
# velt_native_<package>: the library's file name (one per package next to an executable).
name = "velt_native_postgres"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Inside this repository; a published package would depend on these from crates.io.
velt_native = { path = "../../../crates/velt_native", features = ["tokio"] }
velt_text = { path = "../../../crates/velt_text", features = ["sdk"] }
velt_tls = { path = "../../../crates/velt_tls" }
tokio-postgres = { version = "0.7.18", default-features = false }
postgres-protocol = "0.6.12"
bytes = "1.12.1"
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "sync"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
parking_lot = "0.12.5"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
socket2 = "0.6.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# The wire tests drive futures on a current-thread runtime.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "io-util", "sync", "macros"] }

[profile.release]
panic = "unwind"

# Not part of the compiler's workspace.
[workspace]
