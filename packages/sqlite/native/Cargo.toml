[package]
name = "velt_sqlite_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# velt_native_<package>: the library's file name (one per package next to an executable).
name = "velt_native_sqlite"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Inside this repository; a published package would depend on `velt_native` from crates.io.
velt_native = { path = "../../../crates/velt_native" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"

[profile.release]
panic = "unwind"

# Not part of the compiler's workspace.
[workspace]
