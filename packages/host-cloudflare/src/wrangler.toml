# Written by `velt build --host host-cloudflare` because there was none; later builds keep it.
# `npx wrangler deploy` in this directory deploys the Worker; `npx wrangler dev` runs it locally.
name = "{{name}}"
main = "worker.mjs"
# One the Workers runtime the glue was checked on accepts (a local `wrangler dev` rejects a date
# newer than its runtime).
compatibility_date = "2026-08-01"
# A request's `signal` aborts when its client goes away (the glue drops it from the queue).
compatibility_flags = ["enable_request_signal"]
