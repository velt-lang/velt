# Written by `velt build --host registry-cloudflare` because there was none; later builds keep it.
# Fill in `database_id`, then see packages/registry-cloudflare/README.md to deploy.
name = "{{name}}"
main = "worker.mjs"
compatibility_date = "2026-08-01"
# A request's `signal` aborts when its client goes away (the glue drops it from the queue).
compatibility_flags = ["enable_request_signal"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "velt-registry-staging"

[[d1_databases]]
binding = "DB"
database_name = "velt-registry-staging"
database_id = "fill-in"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "LOCKS"
class_name = "RegistryLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegistryLock"]
