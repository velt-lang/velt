[package]
name = "veltc"
version.workspace = true
edition.workspace = true

[[bin]]
name = "velt"
path = "src/main.rs"

[dependencies]
velt_common.workspace = true
velt_syntax.workspace = true
velt_sema.workspace = true
velt_vir.workspace = true
velt_codegen_cl.workspace = true
velt_codegen_llvm.workspace = true
velt_link.workspace = true
vpm.workspace = true
velt_opt.workspace = true
velt_fmt.workspace = true
velt_lsp.workspace = true
velt_http = { path = "../velt_http" }
velt_doc = { path = "../velt_doc" }
velt_registry = { path = "../velt_registry" }
# The runtime as an rlib, for the `velt dev` JIT host.
velt_rt_host = { path = "../velt_rt_host" }
# `velt check --json`.
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
# Stopping the supervised program with SIGTERM.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# velt dev: the job object that ends programs with the supervisor, and the Ctrl-C handler.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
lsp-server = "0.10.0"
lsp-types = "0.95"
tempfile = "3.27.0"
