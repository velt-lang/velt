[package]
name = "velt_registry"
version.workspace = true
edition.workspace = true
# The package registry server behind `velt registry serve`: vpm's registry layout on disk,
# served over HTTP (protocol in crates/vpm/src/remote.rs), with users, tokens and owners.

[dependencies]
# Random user tokens.
getrandom = "0.2.17"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
velt_http = { path = "../velt_http" }
vpm = { path = "../vpm" }

[dev-dependencies]
tempfile = "3.27.0"
