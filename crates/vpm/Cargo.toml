[package]
name = "vpm"
version.workspace = true
edition.workspace = true

[dependencies]
# The archive extractor (extract.rs): gzip and deflate in Rust (miniz_oxide), and Unicode
# normalisation for the paths that clash on macOS.
flate2 = "1.1.10"
# The PKCE verifier and state of `velt login`'s browser sign-in (login/mod.rs).
getrandom = "0.2.17"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
object = { version = "0.39", default-features = false, features = ["read", "std"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Only the `velt.toml` migration converter (manifest/legacy.rs) still reads TOML.
toml = "1.1.6"
velt_common.workspace = true
velt_fmt.workspace = true
velt_http = { path = "../velt_http" }
velt_syntax.workspace = true
# The `velt` field: which toolchain versions build the package.
velt_toolchain.workspace = true

[target.'cfg(windows)'.dependencies]
# Owner-only access for credentials.json (json_file::write_private).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Writes the COFF and Mach-O objects of the bundle-check tests.
object = { version = "0.39", default-features = false, features = ["read", "std", "write_std", "coff", "elf", "macho"] }
tempfile = "3.27.0"
# Archives written by other tools, read back by the extractor's tests.
tar = "0.4"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
