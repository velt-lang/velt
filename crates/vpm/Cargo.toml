[package]
name = "vpm"
version.workspace = true
edition.workspace = true

[dependencies]
object = { version = "0.39", default-features = false, features = ["read", "std"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Only the `velt.toml` migration converter (manifest/legacy.rs) still reads TOML.
toml = "1.1.6"
velt_common.workspace = true
velt_fmt.workspace = true
velt_http = { path = "../velt_http" }
velt_syntax.workspace = true

[target.'cfg(windows)'.dependencies]
# Owner-only access for credentials.json (json_file::write_private).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Writes the COFF and Mach-O objects of the bundle-check tests.
object = { version = "0.39", default-features = false, features = ["read", "std", "write_std", "coff", "elf", "macho"] }
tempfile = "3.27.0"
