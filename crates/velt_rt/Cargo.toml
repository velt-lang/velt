[package]
name = "velt_rt"
version.workspace = true
edition.workspace = true

[lib]
# staticlib: linked into every Velt executable. rlib: lets Rust tests call the ABI directly.
crate-type = ["staticlib", "rlib"]

[dependencies]
bytes = "1.12.1"
dashu-int = "0.6.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "client-legacy", "http1", "http2", "server-graceful"] }
itoa = "1.0.18"
libm = "0.2.16"
# The same C library mimalloc wraps, called directly by mem.rs for the small-alignment fast path.
libmimalloc-sys = { version = "0.1.49", default-features = false, optional = true }
lock_api = "0.4.14"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
parking_lot = "0.12.5"
postgres-protocol = "0.6.12"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
ryu = "1.0.23"
socket2 = "0.6.5"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "fs", "time", "io-util", "sync", "signal", "process"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.8"
webpki-roots = "1.0.9"

[target.'cfg(unix)'.dependencies]
# Listener handover in dev mode (SCM_RIGHTS over a Unix socket).
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Listener handover in dev mode (named pipe + WSADuplicateSocketW).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[features]
# mimalloc is the global allocator by default; build with --no-default-features for the system allocator.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dev-dependencies]
cc = "1.5.1"
# The native-package SDK: its table and value layouts must match `native.rs`.
velt_native = { path = "../velt_native" }
