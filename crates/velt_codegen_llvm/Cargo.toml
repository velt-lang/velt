[package]
name = "velt_codegen_llvm"
version.workspace = true
edition.workspace = true

[dependencies]
velt_vir.workspace = true
velt_codegen_cl.workspace = true
rustc-hash = "2.1.3"
# The build cache key of a codegen unit: its IR hashed in place (clang.rs).
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }

[dev-dependencies]
object = { version = "0.39", default-features = false, features = ["read"] }
velt_opt = { workspace = true, features = ["interp"] }
