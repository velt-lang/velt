[package]
name = "velt_std_redis"
version.workspace = true
edition.workspace = true
description = "std/redis's driver: a crate on the native SDK only (velt_native), linked into the runtime"

[dependencies]
velt_native = { path = "../velt_native", features = ["tokio"] }
velt_tls = { path = "../velt_tls" }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
itoa = "1.0.18"

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "io-util", "sync", "macros"] }
