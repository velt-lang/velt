[package]
name = "velt_text"
version.workspace = true
edition.workspace = true
description = "Velt's string encoding, number formatting and database JSON, for the runtime"

[dependencies]
memchr = "2.8.3"

[features]
# `wtf8::check_canonical` in every profile, for the runtime's own tests: release test builds
# have no `debug_assertions`, and `cfg(test)` is only this crate's.
invariants = []
