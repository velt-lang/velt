[package]
name = "velt_link"
version.workspace = true
edition.workspace = true

[[bin]]
name = "velt-kit"

[dependencies]
# Link kits: stub objects for glibc's libraries (write) and the DLL export lists (read, `velt-kit`).
object = { version = "0.39", default-features = false, features = ["std", "read_core", "write_std", "elf", "pe", "coff", "macho"] }

[target."cfg(windows)".dependencies]
cc = "1.5.1"

[dev-dependencies]
cranelift-codegen = "0.132.3"
cranelift-frontend = "0.132.3"
cranelift-module = "0.132.3"
cranelift-object = "0.132.3"
