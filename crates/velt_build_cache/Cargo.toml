[package]
name = "velt_build_cache"
version.workspace = true
edition.workspace = true
description = "Velt's build cache: compiled code shared by every build on a machine, keyed by content, bounded in size"

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
crc32fast = "1.5"

[dev-dependencies]
tempfile = "3.27.0"
