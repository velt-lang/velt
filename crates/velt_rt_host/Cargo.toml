[package]
name = "velt_rt_host"
version.workspace = true
edition.workspace = true
# The runtime's own sources (crates/velt_rt/src) built a second time as a plain rlib without the
# C `main`, so `velt` can host JIT-compiled programs (`velt dev`). A separate package rather than
# a `velt_rt` feature: cargo unifies features across a workspace build, which would strip `main`
# from the staticlib every program links. The [dependencies] and [features] below must match
# crates/velt_rt/Cargo.toml (tests/manifest.rs checks).
build = "../velt_rt/build.rs"

[lib]
path = "../velt_rt/src/lib.rs"
# velt_rt runs the runtime's unit tests; here they would only run twice. `bench` must be off too:
# with it on, `--all-targets` (check.sh, CI, clippy) still builds the lib's unit tests as a bench
# target, a second runtime-sized compile and link.
test = false
bench = false
doctest = false

[dependencies]
bytes = "1.12.1"
dashu-int = "0.6.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "http1", "http2", "server-graceful"] }
itoa = "1.0.18"
libm = "0.2.16"
# The same C library mimalloc wraps, called directly by mem.rs for the small-alignment fast path.
libmimalloc-sys = { version = "0.1.49", default-features = false, optional = true }
lock_api = "0.4.14"
memchr = "2.8.3"
mio = { version = "1.2.3", features = ["os-poll", "net", "os-ext"] }
mimalloc = { version = "0.1.52", default-features = false, optional = true }
parking_lot = "0.12.5"
parking_lot_core = "0.9.12"
regex = "1.13.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
ryu = "1.0.23"
velt_text = { path = "../velt_text" }
velt_tls = { path = "../velt_tls" }
# std/postgres's driver (an SDK-only crate, linked in: its exports are std's externs).
velt_std_postgres = { path = "../velt_std_postgres" }
# std/sqlite's driver (the same: an SDK-only crate, linked in).
velt_std_sqlite = { path = "../velt_std_sqlite" }
# std/redis's driver (the same).
velt_std_redis = { path = "../velt_std_redis" }
# The SDK the drivers are built on: the runtime hands it its function table at start-up.
velt_native = { path = "../velt_native" }
socket2 = "0.6.5"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "fs", "time", "io-util", "sync", "signal", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.9"

[target.'cfg(unix)'.dependencies]
# Listener handover in dev mode (SCM_RIGHTS over a Unix socket).
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Listener handover in dev mode (named pipe + WSADuplicateSocketW).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[features]
# mimalloc is the global allocator by default; build with --no-default-features for the system allocator.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dev-dependencies]
# velt_rt's unit tests compare the SDK's layouts; needed only when they are built here explicitly
# (`cargo test -p <this crate> --lib`), since the lib has test = false and bench = false.
velt_native = { path = "../velt_native" }
