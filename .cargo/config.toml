# `cargo xtask <command>`: the repository's tooling (crates/xtask), e.g. `cargo xtask check`.
[alias]
xtask = "run --quiet --package xtask --"

# GCC 15 (the default compiler from Ubuntu 26.04 on) compiles C as C23, and glibc 2.38+ then
# calls `strtol` and its kin by their C23 names (`__isoc23_strtol`), which the bundled linker's
# glibc 2.31 stubs (crates/velt_link/kit) do not have: a program linked with the runtime would
# fail to link, and need glibc 2.38 to run. The C dependencies (mimalloc) are compiled as C17.
[env]
CFLAGS_x86_64_unknown_linux_gnu = "-std=gnu17"
CFLAGS_aarch64_unknown_linux_gnu = "-std=gnu17"

# Builds run through cargo (tests, goldens, `cargo run -p veltc`) keep their build cache in this
# checkout's target directory, not in the user's `~/.velt/build-cache`, and smaller: every worktree
# has one. A variable already set in the environment wins.
VELT_BUILD_CACHE = { value = "target/velt-build-cache", relative = true }
VELT_BUILD_CACHE_SIZE = "500M"
