# cargo-nextest (https://nexte.st) runs the unit and integration tests in `cargo xtask check`:
# test binaries in parallel, and only the tests a change needs (crates/xtask/src/plan.rs).
# CI uses the `ci` profile. The end-to-end goldens are a step of their own.

[profile.default]
# Report every failing test, as `cargo test --no-fail-fast` did.
fail-fast = false
slow-timeout = { period = "60s" }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
# A hung test fails after 20 minutes instead of running into the job's timeout.
slow-timeout = { period = "60s", terminate-after = 20 }
# No `retries`, here or in any profile: a test that passes on a second try still has a race (the
# nightly `flake` job runs the timing-sensitive tests many times to find them).

[profile.ci.junit]
# target/nextest/ci/junit.xml: `cargo xtask check` lists the failed tests from it in the job's
# summary, so a failure is attributable without reading the log.
path = "junit.xml"

# The merge queue (`VELT_NEXTEST_PROFILE=queue`, ci.yml's `check` job): the `ci` profile, but the
# first failing test starts no more tests. One failure drops the queue entry, so the rest of the
# run only delays that and holds the runners the entries behind it wait for: from 2026-11-13 to
# 11-16 the job ran on for 9 minutes (median, 23 at most) after its first failure. The tests
# already running finish (`terminate = "immediate"` would report each of them as failed too, in
# the log and the job summary). Pull requests and local runs keep reporting every failure.
[profile.queue]
fail-fast = true
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 20 }

[profile.queue.junit]
path = "junit.xml"

[test-groups]
# Tests that build and run many programs on a worker pool of their own, or wait on timeouts
# (`velt dev` reloads, the debug adapter): two at a time, so they don't starve each other.
end-to-end = { max-threads = 2 }

# The wasm32-wasip1 goldens are eight shards of two threads each, outside that group: they run
# alongside everything else, each counts as the two test threads it keeps busy, and they start
# right after the slowest tests below.
[[profile.default.overrides]]
filter = "binary(wasm_goldens) & test(/^goldens_under_wasmtime_shard_/)"
test-group = "@global"
threads-required = 2
priority = 50

[[profile.default.overrides]]
filter = """
binary(wasm_goldens) | binary(native_packages) | binary(reload) | binary(debugger) \
| binary(docs) | binary(llvm_goldens) | binary(panic_locations) | binary(playground)\
"""
test-group = "end-to-end"

# The slowest tests (a minute or more each; the parser's robustness shards with
# VELT_ROBUSTNESS=full) start first, so they don't finish alone at the end.
[[profile.default.overrides]]
filter = """
test(/^prefixes_never_panic_/) | binary(native_packages) | (package(velt_vir) & binary(native)) \
| test(=examples_compile_and_run) | test(=random_programs_match_interpreter) | binary(reload) \
| test(=std_modules_pass_their_tests)\
"""
priority = 100

# std's own test files, all in one test: 19 minutes on the Windows runner on 2026-11-21 (1,140 s,
# then 1,200 s, the limit, when a merge train added crypto tests). It gets twice the others' limit
# until it is split into shards.
[[profile.ci.overrides]]
filter = "test(=std_modules_pass_their_tests)"
slow-timeout = { period = "60s", terminate-after = 40 }

[[profile.queue.overrides]]
filter = "test(=std_modules_pass_their_tests)"
slow-timeout = { period = "60s", terminate-after = 40 }
