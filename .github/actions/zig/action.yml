name: zig
description: >-
  The pinned zig (crates/velt_toolchain/src/zig.rs), checked against its SHA-256, as VELT_ZIG for
  the later steps, from the Actions cache. Two kinds of job use it: the `c-headers` job, whose
  tests check C headers through it (with VELT_ZIG_TESTS=1, crates/xtask/src/c_headers.rs), and
  the jobs whose tests build a package's C `sources`, selected by the plan
  (crates/xtask/src/zig.rs: `zig_tests`, `zig_goldens`, `windows_zig`, and every `--full` run).
  VELT_ZIG alone runs none of the header tests. A job without it that builds C sources still
  works: velt downloads the pinned zig from ziglang.org on first use. It also restores the C
  bundles of the repository's packages with C sources (packages/sqlite/target/velt-native,
  zig.rs's PACKAGES), so a job builds SQLite only when what the bundle is built from changed.
inputs:
  working-directory:
    description: >-
      Where to run cargo: the Dev Drive copy on Windows (`DEV_DRIVE_WORKSPACE`), so the build
      shares the job's target directory.
    default: .
runs:
  using: composite
  steps:
    # Caches saved by pull request and merge queue runs can't be restored by other branches: the
    # nightly's, from main, is the one they find, which keeps them off ziglang.org.
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/.velt-zig
        key: zig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/velt_toolchain/src/zig.rs') }}
    # From the cache (its key is zig.rs, which pins the version) without building anything, as
    # the golden shards build nothing else; otherwise downloaded and checked by velt_toolchain.
    - name: the pinned zig
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        zig=
        if [ "$HIT" = true ]; then
          for f in "$HOME"/.velt-zig/cache/zig/*/zig-*/zig "$HOME"/.velt-zig/cache/zig/*/zig-*/zig.exe; do
            if [ -f "$f" ]; then zig=$f; break; fi
          done
          if [ -n "$zig" ] && [ "$RUNNER_OS" = Windows ]; then zig=$(cygpath -m "$zig"); fi
        fi
        if [ -z "$zig" ]; then
          zig=$(cargo run --quiet -p velt_toolchain --example zig -- "$HOME/.velt-zig")
        fi
        "$zig" version
        echo "VELT_ZIG=$zig" >> "$GITHUB_ENV"
    # The C bundles of zig.rs's PACKAGES, built by an earlier run (crates/vpm/src/native/c_build.rs): a cold
    # build of packages/sqlite's sqlite3.c takes about 25 s of CPU on an M-series Mac, longer on a
    # runner, and each job that builds a program importing sqlite waits for it. velt rebuilds a
    # bundle whose `<target>.key` doesn't match what it is built from, so an older one restored
    # by the prefix only costs its download (about 5 MB).
    - uses: actions/cache@v4
      with:
        path: ${{ inputs.working-directory }}/packages/sqlite/target/velt-native
        key: >-
          c-bundles-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/sqlite/package.velt',
          'packages/sqlite/native/**', 'crates/velt_toolchain/src/zig.rs',
          'crates/vpm/src/native/c_build.rs') }}
        restore-keys: c-bundles-${{ runner.os }}-${{ runner.arch }}-
