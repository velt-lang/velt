name: setup
description: >-
  Rust toolchain, a build cache, cargo-nextest and (for the tests) wasmtime, node and clang. On
  Windows the checkout is copied to a Dev Drive first: run later steps in the directory in
  DEV_DRIVE_WORKSPACE when it is set.
inputs:
  tools:
    description: Install what the tests need besides Rust (wasmtime, node, clang on macOS).
    default: "true"
  wasmtime:
    description: The wasmtime release the tests run under (with `tools`).
    default: v49.0.1
  cache:
    description: >-
      Restore the build cache. Jobs that build nothing (the queue's golden shards, which run a
      build another job packed) skip it.
    default: "true"
  fast-linker:
    description: >-
      Link Velt programs with the Rust toolchain's lld on Linux, as `velt` does wherever `ld.lld` is
      on PATH. The runners have only GNU ld, which takes seconds per program with the static
      runtime. The nightly gate keeps GNU ld, what a machine without lld links with.
    default: "true"
  code-cache:
    description: >-
      Restore clang's objects from the last nightly gate (Linux, for jobs that run tests: `tools`). Clang's object is keyed by the IR
      and the clang, not by the compiler (crates/velt_build_cache), and a change leaves most
      programs' IR as it was. A cache that doesn't apply is only misses.
    default: "true"
  save-cache:
    description: >-
      Save the build cache. Only the pushes to main do (`main` job in ci.yml): caches saved
      by a pull request or merge queue run can't be restored by any other branch.
    default: "false"
runs:
  using: composite
  steps:
    # A merge queue entry that drops out (fails, is removed, or one ahead of it fails) makes the
    # queue test the entries behind it again under new branches and delete the old ones. The old
    # runs keep going and hold runners (and queue for more) that the live entries wait for:
    # 2026-11-03, with 5 macOS runners and an account-wide job limit, live entries waited up to
    # 110 minutes for runners. queue-plan checks the branch only when the run starts; each job
    # checks again when it gets its runner, which under load is many minutes later, and cancels
    # the whole run (its queued jobs too) when GitHub says the branch is gone. Only a 404 for the
    # queue branch, twice 10 s apart, while the same token reads `main` (200: a token that can't
    # read the repository gets 404 for everything) counts: any other answer checks as usual, so a
    # live entry is never cancelled. The job needs `actions: write` to cancel; without it the run
    # goes on as before.
    - name: is this merge queue entry still live
      if: github.event_name == 'merge_group'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        status() {
          curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/$1" || true
        }
        gone() {
          [ "$(status "${GITHUB_REF#refs/}")" = 404 ] && [ "$(status heads/main)" = 200 ]
        }
        if gone && sleep 10 && gone; then
          echo "::notice title=queue entry gone::$GITHUB_REF is no longer in the merge queue: cancelling this run to free its runners."
          # The cancellation stops this job within seconds; don't start a build meanwhile.
          if gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"; then
            sleep 60
          fi
        fi
    # ReFS with the antivirus filter detached: cargo's many small files build much faster than on
    # the runner's NTFS drives. The checkout is copied there (so `target/` is there too).
    - name: dev drive (Windows)
      if: runner.os == 'Windows'
      uses: samypr100/setup-dev-drive@v4
      with:
        drive-size: 60GB
        drive-format: ReFS
        drive-type: Dynamic
        workspace-copy: true
        trusted-dev-drive: true
    # The toolchain, components and targets come from rust-toolchain.toml.
    - name: rust (pinned)
      shell: bash
      run: rustup toolchain install && rustc --version
    - name: lld on PATH (Linux)
      if: runner.os == 'Linux' && inputs.fast-linker == 'true'
      shell: bash
      run: |
        dir="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/gcc-ld"
        echo "ld.lld on PATH before this step: $(command -v ld.lld || echo none)"
        [ -x "$dir/ld.lld" ] || { echo "::error::no ld.lld in $dir"; exit 1; }
        echo "$dir" >> "$GITHUB_PATH"
    # Keyed by OS, architecture and rust-cache-key.sh's hash of what the dependencies' compiled
    # output depends on: rust-toolchain.toml, Cargo.lock's external packages, and the manifests'
    # profiles, dependency tables and features (not `[package]`, so a release keeps the key), plus
    # .cargo/config.toml. rust-cache's own hash takes in every toolchain rustup lists (runner images
    # differ in their preinstalled stable, which split the cache into two live keys per OS on Oct
    # 15) and the whole manifests (any edit made a new entry). Now the `main` job saves a new entry
    # exactly when one of those inputs changes; until it has, jobs start without a cache. The
    # nightly `cache-prune` job deletes the superseded entries.
    - name: rust-cache key
      id: rust-cache-key
      shell: bash
      run: |
        key=$(bash "${GITHUB_ACTION_PATH//\\//}/rust-cache-key.sh")
        [ -n "$key" ] || { echo "::error::rust-cache-key.sh printed no key"; exit 1; }
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - uses: Swatinem/rust-cache@v2
      if: inputs.cache == 'true'
      with:
        workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
        prefix-key: v1-rust
        shared-key: ${{ steps.rust-cache-key.outputs.key }}
        add-rust-environment-hash-key: "false"
        save-if: ${{ inputs.save-cache == 'true' }}
        cache-on-failure: true
    # The workspace's own crates: rust-cache keeps only the dependencies, so without this every job
    # compiles all of them again, however little changed. Keyed by each crate's sources and flags
    # in the Actions cache; a failure there is only a miss (SCCACHE_IGNORE_SERVER_IO_ERROR). A merge
    # queue entry reads and doesn't write: its branch is deleted when it ends and no other can read
    # what it saved, at 600-900 MiB an entry, which would push out what others can use. Pushes to
    # `main` save what every other run reads, and a pull request's later pushes read its own.
    - uses: mozilla-actions/sccache-action@v0.0.11
      if: inputs.cache == 'true'
    - name: compile through sccache
      if: inputs.cache == 'true'
      shell: bash
      run: |
        {
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=true"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            echo "SCCACHE_GHA_RW_MODE=READ_ONLY"
          fi
        } >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v4
      if: inputs.code-cache == 'true' && inputs.tools == 'true' && runner.os == 'Linux'
      with:
        path: target/velt-build-cache/v*/llvm
        key: velt-clang-objects-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        restore-keys: velt-clang-objects-${{ runner.os }}-${{ runner.arch }}-
    - name: room for clang's objects
      if: inputs.code-cache == 'true' && inputs.tools == 'true' && runner.os == 'Linux'
      shell: bash
      run: echo "VELT_BUILD_CACHE_SIZE=4G" >> "$GITHUB_ENV"
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    # wasmtime and node enable the WebAssembly and playground tests. wasmtime is a pinned
    # release kept in the Actions cache: a release download from GitHub fails now and then
    # (HTTP 504 three times in a row dropped a pull request from the merge queue), and failing
    # setup fails the job, so the download happens once per version and retries for minutes.
    - if: inputs.tools == 'true'
      id: wasmtime-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/wasmtime-ci
        key: wasmtime-${{ inputs.wasmtime }}-${{ runner.os }}-${{ runner.arch }}
    - name: wasmtime ${{ inputs.wasmtime }}
      if: inputs.tools == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.wasmtime }}
        DIR: ${{ runner.tool_cache }}/wasmtime-ci
        CACHED: ${{ steps.wasmtime-cache.outputs.cache-hit }}
      run: |
        if [ "$CACHED" != true ]; then
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) target=x86_64-linux ;;
            Linux-ARM64) target=aarch64-linux ;;
            macOS-X64) target=x86_64-macos ;;
            macOS-ARM64) target=aarch64-macos ;;
            Windows-X64) target=x86_64-windows ;;
            *) echo "no wasmtime release for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          name="wasmtime-$VERSION-$target"
          ext=tar.xz exe=
          [ "$RUNNER_OS" = Windows ] && ext=zip exe=.exe
          archive="$RUNNER_TEMP/$name.$ext"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 15 -o "$archive" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/$VERSION/$name.$ext"
          if [ "$ext" = zip ]; then
            pwsh -NoProfile -Command "Expand-Archive -Path '$archive' -DestinationPath '$RUNNER_TEMP'"
          else
            tar -xJf "$archive" -C "$RUNNER_TEMP"
          fi
          mkdir -p "$DIR"
          cp "$RUNNER_TEMP/$name/wasmtime$exe" "$DIR/"
        fi
        echo "$DIR" >> "$GITHUB_PATH"
        "$DIR/wasmtime" --version
    - if: inputs.tools == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22
    # The LLVM backend (--release goldens) needs clang 16 or newer; Apple's clang can be older.
    - name: clang (macOS)
      if: inputs.tools == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm >/dev/null
        echo "VELT_CLANG=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
