# TEMPORARY, not for main: runs this branch's bf16 change on a Linux arm64 runner.
name: tmp-arm64-check

on:
  push:
    branches: [claude/fervent-hawking-u6idno]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: "false"
          code-cache: "false"
      - name: the CPU
        run: |
          lscpu | head -n 20
          for f in asimdhp asimdfhm asimddp bf16 i8mm sve pmull; do
            grep -m1 Features /proc/cpuinfo | grep -qw "$f" && echo "has $f" || echo "NO $f"
          done
      - name: clang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang valgrind
          echo "VELT_CLANG=$(command -v clang)" >> "$GITHUB_ENV"
      - name: build velt (release)
        run: |
          cargo build --release -q -p veltc -p velt_rt
          target/release/velt --version
      - name: build main's velt (release)
        run: |
          git fetch -q --depth 1 origin main
          mkdir .base
          git archive FETCH_HEAD | tar -x -C .base
          cd .base
          cargo build --release -q -p veltc -p velt_rt
      - name: goldens, debug and release, with and without the run-time answer
        run: |
          fail=0
          for t in std/simd_bf16_dot_fast std/simd_half_dot std/half_dot std/dot_at; do
            for mode in "" "--release" "--release --cpu native"; do
              for off in "" clmul; do
                if VELT_SIMD_DISABLE=$off target/release/velt run $mode tests/golden/$t.velt 2>/dev/null | diff -q - tests/golden/$t.out >/dev/null; then
                  echo "ok   $t $mode off=$off"
                else
                  echo "FAIL $t $mode off=$off"
                  VELT_SIMD_DISABLE=$off target/release/velt run $mode tests/golden/$t.velt 2>&1 | diff - tests/golden/$t.out | head -n 20
                  fail=1
                fi
              done
            done
          done
          exit $fail
      - name: which path runs
        if: always()
        run: |
          out="$RUNNER_TEMP/p" && mkdir -p "$out"
          cat > "$out/has.velt" <<'V'
          import { bf16x8 } from "velt/simd";
          console.log("hasBf16Arm", bf16x8.hasBf16Arm());
          V
          sed -i 's/^          //' "$out/has.velt"
          target/release/velt run "$out/has.velt"
          target/release/velt run --release "$out/has.velt"
          VELT_SIMD_DISABLE=clmul target/release/velt run --release "$out/has.velt"
          target/release/velt build --release tests/golden/std/simd_bf16_dot_fast.velt -o "$out/fast"
          echo "bfdot instructions in the default build: $(objdump -d --no-show-raw-insn "$out/fast" | grep -c bfdot)"
          # The instruction really runs: count executions of bfdot's block is not available, so
          # compare instruction counts with the answer on and off.
          valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null "$out/fast" 2>&1 | grep "I *refs" || true
          VELT_SIMD_DISABLE=clmul valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null "$out/fast" 2>&1 | grep "I *refs" || true
      - name: the tests of the change
        if: always()
        run: |
          cargo test -q -p veltc --test cpu_levels dot_add_fast
          cargo test -q -p velt_codegen_llvm bfdot
      - name: bf16 kernels (#3129), main against this branch
        if: always()
        run: |
          out="$RUNNER_TEMP/b" && mkdir -p "$out"
          src=.github/tmp-arm64/bf16.velt
          target/release/velt build --release $src -o "$out/ref"
          target/release/velt build --release --cpu native $src -o "$out/ref-native"
          VELT_STD="$PWD/.base/std" .base/target/release/velt build --release $src -o "$out/base"
          VELT_STD="$PWD/.base/std" .base/target/release/velt build --release --cpu native $src -o "$out/base-native"
          for pass in 1 2 3; do
            for b in base ref base-native ref-native; do
              echo "== pass $pass: $b"
              "$out/$b"
            done
            echo "== pass $pass: ref-off"
            VELT_SIMD_DISABLE=clmul "$out/ref"
          done | tee "$out/all.txt"
          {
            echo "### bf16 kernels on $(uname -sm), ns per 384-dim dot, best of 3 passes"
            echo
            echo "| build | f16 | bf16 dotAdd | bf16 dotAddFast |"
            echo "|---|---:|---:|---:|"
            python3 - "$out/all.txt" <<'PY'
          import re, sys
          best = {}
          build = None
          for line in open(sys.argv[1]):
              m = re.match(r"== pass \d+: (\S+)", line)
              if m:
                  build = m.group(1)
                  continue
              m = re.match(r"(\w+): ([\d.]+) ns", line)
              if m:
                  key = (build, m.group(1))
                  best[key] = min(best.get(key, 1e9), float(m.group(2)))
          for b in ["base", "ref", "ref-off", "base-native", "ref-native"]:
              print(f"| {b} | {best.get((b, 'f16'))} | {best.get((b, 'bf16'))} | {best.get((b, 'bf16fast'))} |")
          PY
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "the dotAddFast loop of the default build:"
          objdump -d --no-show-raw-insn "$out/ref" | grep -B12 -A6 bfdot | head -n 60
