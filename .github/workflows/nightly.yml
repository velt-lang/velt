# Nightly: the full gate on Linux with real PostgreSQL and Redis, so the database goldens run
# (they are skipped without their URLs) and the parser's robustness test cuts every golden at
# every character (pull requests and the queue cut a sample), and then the differential tests
# against Node (tests/difftest), the Cranelift compile-memory stress run (bench/compile/stress.sh,
# stress.ps1) on Linux and Windows, the `tsc` oracle for `velt check --ts-compat`
# (tests/tscompat-oracle), the benchmarks' instruction counts against the last accepted ones
# (bench/nightly.sh), and the WebAssembly goldens on Windows and macOS. A manual run can pick one
# of them: `gh workflow run nightly -f only=stress`.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run only one job (scheduled runs run all of them).
        type: choice
        options: [all, gate, stress, oracle, bench, wasm]
        default: all
      bench_baseline:
        description: >-
          bench: `accept` stores this run's counts as the baseline without comparing (after an
          intended slowdown).
        type: choice
        options: [compare, accept]
        default: compare

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  gate-with-services:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: velt
          POSTGRES_DB: velt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      VELT_TEST_PG_URL: postgres://postgres:velt@127.0.0.1:5432/velt_test
      VELT_TEST_REDIS_URL: redis://127.0.0.1:6379
      # The parser's robustness test cuts every golden at every character, not a sample
      # (crates/velt_syntax/tests/robustness.rs).
      VELT_ROBUSTNESS: full
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/check-all.sh
      # Node is the oracle: the hand-written corpus and short generated runs must agree with it.
      # All three run even when one finds a mismatch (each finds different bugs); the step fails
      # at the end if any did.
      - name: difftest (corpus, short fuzz)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: |
          status=0
          tests/difftest/run.sh run tests/difftest/corpus -j 4 || status=1
          tests/difftest/run.sh fuzz --seeds 0..200 -j 4 || status=1
          tests/difftest/run.sh fuzz --std --seeds 0..100 -j 4 || status=1
          exit "$status"
      # The failing programs, shrunk, with what differed (tests/difftest/README.md).
      - name: difftest reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: difftest-out
          path: tests/difftest/out
          if-no-files-found: ignore

  # A debug build (Cranelift) of long_main_16000 must stay under 2 GB of peak memory and print the
  # right result (#42, #189). The script prints the stage times and the peak; the summary shows them.
  compile-stress:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'stress'
    name: compile-stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: "false"
      - name: bench/compile/stress.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          bench/compile/stress.sh 2>&1 | tee "$RUNNER_TEMP/stress.log"
      - name: bench/compile/stress.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          pwsh -NoProfile -File bench/compile/stress.ps1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/stress.log"
          exit $LASTEXITCODE
      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo "### compile stress (${{ runner.os }})"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/stress.log" 2>/dev/null || echo "no log (the run stopped before the stress script)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The WebAssembly goldens (crates/veltc/tests/wasm_goldens.rs) on Windows and macOS: the queue
  # skips them unless a change touches WebAssembly code, and the push to main runs these OSes only
  # after a Linux-only queue run, so this is where every change meets them there. The plan of a
  # change to the WebAssembly runtime selects exactly them (and that runtime's tests).
  wasm-goldens:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'wasm'
    name: wasm-goldens (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: cargo xtask check --part test (WebAssembly)
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo xtask check --part test --paths crates/velt_rt_wasm/src/lib.rs

  # The lint's claims against a pinned TypeScript (crates/velt_tscompat/tests/oracle.rs): the
  # rule fixtures compile with `tsc` where the lint passes them, and each rule's sample is
  # rejected (or, for a behaviour rule, accepted). Behaviour samples then run under `velt run`
  # and Node, which must print differently, and the same once the lint's fixes are applied
  # (crates/veltc/tests/ts_compat_node). The pull request gate skips the parts that need the
  # Node packages or a Node that strips types; VELT_TSC_ORACLE=1 makes them fail here.
  tsc-oracle:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'oracle'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELT_TSC_ORACLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Node runs the behaviour samples with their types stripped (22.7 or newer).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm ci (the pinned typescript)
        working-directory: tests/tscompat-oracle
        run: npm ci --no-audit --no-fund
      - name: oracle
        run: cargo test -p velt_tscompat --test oracle -- --nocapture
      - name: behaviour samples under Node
        run: cargo test -p veltc --test ts_compat behaviour_samples -- --nocapture

  # Instructions per benchmark (bench/nightly.sh: valgrind, so the counts don't depend on how busy
  # the runner is) against the counts of the last run that passed, kept in the Actions cache. More
  # than 3% more instructions in any benchmark fails the job and opens (or comments on) the issue
  # "nightly benchmarks regressed"; the baseline then stays put, so the job keeps failing until the
  # slowdown is fixed or accepted (`gh workflow run nightly -f only=bench -f bench_baseline=accept`).
  # The cache key ends in the baseline's commit, so the issue names the commits since then.
  bench:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: "false"
      - name: valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - name: restore the baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline.tsv
          key: bench-baseline-${{ github.run_id }}-${{ github.sha }}
          restore-keys: bench-baseline-
      - name: bench/nightly.sh
        id: bench
        env:
          ACCEPT: ${{ inputs.bench_baseline == 'accept' }}
        run: |
          set -o pipefail
          args=()
          if [ -f bench-baseline.tsv ] && [ "$ACCEPT" != true ]; then
            args=(--baseline bench-baseline.tsv)
          fi
          bench/nightly.sh "${args[@]}" --out "$RUNNER_TEMP/counts.tsv" | tee "$RUNNER_TEMP/bench.md"
      - name: summary
        if: always()
        run: |
          {
            echo "### benchmarks (instructions, valgrind)"
            cat "$RUNNER_TEMP/bench.md" 2>/dev/null || echo "no results (the run stopped before the benchmarks)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Only counts that passed (or were accepted) become the baseline.
      - name: keep the counts as the baseline
        run: cp "$RUNNER_TEMP/counts.tsv" bench-baseline.tsv
      - uses: actions/cache/save@v4
        with:
          path: bench-baseline.tsv
          key: bench-baseline-${{ github.run_id }}-${{ github.sha }}
      - name: report the regression
        if: failure() && steps.bench.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          BASELINE_KEY: ${{ steps.baseline.outputs.cache-matched-key }}
        with:
          script: |
            const fs = require('fs');
            const title = 'nightly benchmarks regressed';
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const run = `${repoUrl}/actions/runs/${context.runId}`;
            const head = context.sha;
            // The rows over the limit, from the table bench/nightly.sh printed.
            let rows = [];
            try {
              rows = fs.readFileSync(`${process.env.RUNNER_TEMP}/bench.md`, 'utf8')
                .split('\n').filter(l => l.includes('**regression**'));
            } catch (e) {}
            const table = rows.length
              ? ['| benchmark | instructions (M) | baseline (M) | change | native ms |', '|---|---:|---:|---:|---:|', ...rows].join('\n')
              : '(the job summary has the table)';
            // The baseline's commit is the end of its cache key (keys saved before it was added
            // end in the run id only).
            const base = (process.env.BASELINE_KEY || '').match(/-([0-9a-f]{40})$/)?.[1];
            let range = `The baseline's commit is unknown (its cache entry predates recording it); the counts were taken at ${head.slice(0, 9)}.`;
            if (base) {
              range = `Commits since the baseline: [\`${base.slice(0, 9)}..${head.slice(0, 9)}\`](${repoUrl}/compare/${base}...${head})`;
              try {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({ ...context.repo, basehead: `${base}...${head}`, per_page: 100 });
                // Subjects in code spans, so their `(#n)` doesn't mention each pull request daily.
                const lines = cmp.data.commits.map(c => `- ${c.sha.slice(0, 9)} \`${c.commit.message.split('\n')[0].replace(/`/g, "'")}\``);
                range += ` (${cmp.data.total_commits}):\n\n${lines.join('\n')}`;
                if (cmp.data.total_commits > lines.length) range += `\n- … and ${cmp.data.total_commits - lines.length} more`;
              } catch (e) {
                range += '.';
              }
            }
            const body = [
              `A benchmark executes more than 3% more instructions than the baseline: ${run}`,
              table,
              range,
              'Bisect the range with instruction counts (docs/internals/maintaining.md, "A red nightly"). Fix it, or, when the growth is intended, accept the new counts with `gh workflow run nightly -f only=bench -f bench_baseline=accept`.',
            ].join('\n\n');
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
