# Nightly: the full gate on Linux with real PostgreSQL and Redis, so the database goldens run
# (they are skipped without their URLs) and the parser's robustness test cuts every golden at
# every character (pull requests and the queue cut a sample), and then the differential tests
# against Node (tests/difftest), the Cranelift compile-memory stress run (bench/compile/stress.sh,
# stress.ps1) on Linux and Windows, the `tsc` oracle for `velt check --ts-compat`
# (tests/tscompat-oracle), the benchmarks' instruction counts against the last accepted ones
# (bench/nightly.sh), and the WebAssembly goldens on Windows and macOS. Then the timing-sensitive
# tests, many times on Windows and macOS (`flake`), and the deletion of superseded build caches
# (`cache-prune`). A manual run can pick one of them: `gh workflow run nightly -f only=stress`.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run only one job (scheduled runs run all of them).
        type: choice
        options: [all, gate, stress, oracle, bench, wasm, flake, cache]
        default: all
      bench_baseline:
        description: >-
          bench: `accept` stores this run's counts as the baseline without comparing (after an
          intended slowdown).
        type: choice
        options: [compare, accept]
        default: compare
      flake_rounds:
        description: "flake: how many times each test runs."
        type: number
        default: 20

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  gate-with-services:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'gate'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: velt
          POSTGRES_DB: velt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      VELT_TEST_PG_URL: postgres://postgres:velt@127.0.0.1:5432/velt_test
      VELT_TEST_REDIS_URL: redis://127.0.0.1:6379
      # The parser's robustness test cuts every golden at every character, not a sample
      # (crates/velt_syntax/tests/robustness.rs).
      VELT_ROBUSTNESS: full
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: scripts/check-all.sh
      # Node is the oracle: the hand-written corpus and short generated runs must agree with it.
      # All three run even when one finds a mismatch (each finds different bugs); the step fails
      # at the end if any did.
      - name: difftest (corpus, short fuzz)
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        run: |
          status=0
          tests/difftest/run.sh run tests/difftest/corpus -j 4 || status=1
          tests/difftest/run.sh fuzz --seeds 0..200 -j 4 || status=1
          tests/difftest/run.sh fuzz --std --seeds 0..100 -j 4 || status=1
          exit "$status"
      # The failing programs, shrunk, with what differed (tests/difftest/README.md).
      - name: difftest reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: difftest-out
          path: tests/difftest/out
          if-no-files-found: ignore

  # A debug build (Cranelift) of long_main_16000 must stay under 2 GB of peak memory and print the
  # right result (#42, #189). The script prints the stage times and the peak; the summary shows them.
  compile-stress:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'stress'
    name: compile-stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: "false"
      - name: bench/compile/stress.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          bench/compile/stress.sh 2>&1 | tee "$RUNNER_TEMP/stress.log"
      - name: bench/compile/stress.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          pwsh -NoProfile -File bench/compile/stress.ps1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/stress.log"
          exit $LASTEXITCODE
      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo "### compile stress (${{ runner.os }})"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/stress.log" 2>/dev/null || echo "no log (the run stopped before the stress script)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The WebAssembly goldens (crates/veltc/tests/wasm_goldens.rs) on Windows and macOS: the queue
  # skips them unless a change touches WebAssembly code, and the push to main runs these OSes only
  # after a Linux-only queue run, so this is where every change meets them there. The plan of a
  # change to the WebAssembly runtime selects exactly them (and that runtime's tests).
  wasm-goldens:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'wasm'
    name: wasm-goldens (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: cargo xtask check --part test (WebAssembly)
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo xtask check --part test --paths crates/velt_rt_wasm/src/lib.rs

  # The lint's claims against a pinned TypeScript (crates/velt_tscompat/tests/oracle.rs): the
  # rule fixtures compile with `tsc` where the lint passes them, and each rule's sample is
  # rejected (or, for a behaviour rule, accepted). Behaviour samples then run under `velt run`
  # and Node, which must print differently, and the same once the lint's fixes are applied
  # (crates/veltc/tests/ts_compat_node). The pull request gate skips the parts that need the
  # Node packages or a Node that strips types; VELT_TSC_ORACLE=1 makes them fail here.
  tsc-oracle:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'oracle'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VELT_TSC_ORACLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Node runs the behaviour samples with their types stripped (22.7 or newer).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm ci (the pinned typescript)
        working-directory: tests/tscompat-oracle
        run: npm ci --no-audit --no-fund
      - name: oracle
        run: cargo test -p velt_tscompat --test oracle -- --nocapture
      - name: behaviour samples under Node
        run: cargo test -p veltc --test ts_compat behaviour_samples -- --nocapture

  # Instructions per benchmark (bench/nightly.sh: valgrind, so the counts don't depend on how busy
  # the runner is) against the counts of the last run that passed, kept in the Actions cache. More
  # than 3% more instructions in any benchmark fails the job and opens (or comments on) the issue
  # "nightly benchmarks regressed"; the baseline then stays put, so the job keeps failing until the
  # slowdown is fixed or accepted (`gh workflow run nightly -f only=bench -f bench_baseline=accept`).
  bench:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: "false"
      - name: valgrind
        run: sudo apt-get update -q && sudo apt-get install -y -q valgrind
      - name: restore the baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline.tsv
          key: bench-baseline-${{ github.run_id }}
          restore-keys: bench-baseline-
      - name: bench/nightly.sh
        id: bench
        env:
          ACCEPT: ${{ inputs.bench_baseline == 'accept' }}
        run: |
          set -o pipefail
          args=()
          if [ -f bench-baseline.tsv ] && [ "$ACCEPT" != true ]; then
            args=(--baseline bench-baseline.tsv)
          fi
          bench/nightly.sh "${args[@]}" --out "$RUNNER_TEMP/counts.tsv" | tee "$RUNNER_TEMP/bench.md"
      - name: summary
        if: always()
        run: |
          {
            echo "### benchmarks (instructions, valgrind)"
            cat "$RUNNER_TEMP/bench.md" 2>/dev/null || echo "no results (the run stopped before the benchmarks)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Only counts that passed (or were accepted) become the baseline.
      - name: keep the counts as the baseline
        run: cp "$RUNNER_TEMP/counts.tsv" bench-baseline.tsv
      - uses: actions/cache/save@v4
        with:
          path: bench-baseline.tsv
          key: bench-baseline-${{ github.run_id }}
      - name: report the regression
        if: failure() && steps.bench.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'nightly benchmarks regressed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `A benchmark executes more than 3% more instructions than the baseline after ${context.sha.slice(0, 7)}: ${run} (the job summary has the table). Fix it, or accept the new counts with \`gh workflow run nightly -f only=bench -f bench_baseline=accept\`.`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

  # The tests that have failed now and then in the merge queue, mostly on Windows and macOS: the
  # async, promise and timer goldens and the `velt dev` reload goldens, each run 20 times (one job
  # per OS and suite: a round of each takes about 5 minutes). There are no automatic retries here
  # or anywhere else (they would hide real races in the runtime): every failure is recorded, the
  # job fails, and `flake-report` opens or updates one issue per test that failed, so a flaky test
  # shows up here before it drops pull requests from the queue.
  flake:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'flake'
    name: flake (${{ matrix.os }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        suite: [golden, reload_goldens]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      ROUNDS: ${{ inputs.flake_rounds || 20 }}
      SUITE: ${{ matrix.suite }}
      VELT_GOLDEN: lang/async,lang/promise,std/timers,std/global_timers,async_dispatch/
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: build the tests
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo test -p veltc --test golden --test reload --no-run
      # failures.tsv: one line per test and round that failed (test, round, log): the golden file
      # or reload case the failure names, else (a crash, a build error) the whole test.
      - name: ${{ matrix.suite }}, ${{ env.ROUNDS }} times
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: |
          out="$RUNNER_TEMP/flake"
          mkdir -p "$out/logs"
          : > "$out/failures.tsv"
          cases=$(find tests/reload -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | paste -sd '|' -)
          for round in $(seq 1 "$ROUNDS"); do
            log=$SUITE-$round.log
            start=$SECONDS
            if [ "$SUITE" = golden ]; then
              cargo test -q -p veltc --test golden -- --exact golden > "$out/logs/$log" 2>&1
            else
              cargo test -q -p veltc --test reload reload_goldens -- --exact > "$out/logs/$log" 2>&1
            fi && status=ok || status=failed
            if [ "$status" = ok ]; then
              rm "$out/logs/$log"
              ids=
            elif [ "$SUITE" = golden ]; then
              ids=$(grep -oE '^tests[\\/]golden[\\/][^ :]+\.vlt' "$out/logs/$log" | sed 's|\\|/|g' | sort -u || true)
            else
              ids=$(grep -oE "^($cases) (Jit|Exe): " "$out/logs/$log" | cut -d' ' -f1 | sort -u | sed 's|^|tests/reload/|' || true)
            fi
            named=${ids:-(none named)}
            echo "round $round: $status in $((SECONDS - start))s${ids:+: ${named//$'\n'/, }}"
            if [ "$status" = failed ]; then
              while read -r id; do
                printf '%s\t%s\t%s\n' "${id:-$SUITE}" "$round" "$log" >> "$out/failures.tsv"
              done <<< "$ids"
            fi
          done
          {
            echo "### flake (${{ runner.os }}, $SUITE): $ROUNDS rounds"
            if [ -s "$out/failures.tsv" ]; then
              echo '| test | rounds failed |'
              echo '|---|---|'
              cut -f1 "$out/failures.tsv" | sort | uniq -c | while read -r n id; do echo "| \`$id\` | $n |"; done
            else
              echo 'No failures.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ ! -s "$out/failures.tsv" ]
      - name: keep the failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: flake-${{ runner.os }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/flake
          if-no-files-found: ignore

  # One issue per failing test: an open issue carrying the test's marker, or else one whose title
  # names the test and says it is flaky or timing-dependent (#909, #1064, ...), gets a comment;
  # otherwise a new issue "Flaky: <test>" is opened.
  flake-report:
    needs: flake
    if: ${{ !cancelled() && needs.flake.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flake-*
          path: flake
      - uses: actions/github-script@v7
        env:
          ROUNDS: ${{ inputs.flake_rounds || 20 }}
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const shortName = id => id.split('/').pop().replace(/\.vlt$/, '');
            // The test's part of a log: from the line naming it (else from the panic).
            const excerpt = (file, id, where) => {
              let lines;
              try { lines = fs.readFileSync(file, 'utf8').split(/\r?\n/); } catch { return ''; }
              const name = shortName(id);
              let at = lines.findIndex(l => l.replace(/\\/g, '/').startsWith(id) || l.startsWith(`${name} `));
              if (at < 0) at = Math.max(0, lines.findIndex(l => /panicked|FAILED/.test(l)));
              // Up to the next failure (another golden or reload case), at most 40 lines.
              const next = lines.findIndex((l, i) => i > at && /^(tests[\\/]golden[\\/]\S+\.vlt[ :]|\w+ (Jit|Exe): )/.test(l));
              const text = lines.slice(at, Math.min(at + 40, next < 0 ? Infinity : next)).join('\n')
                .replace(/```/g, '~~~').slice(0, 4000);
              return `${where}:\n\`\`\`\n${text}\n\`\`\``;
            };
            const tests = new Map();
            for (const dir of fs.existsSync('flake') ? fs.readdirSync('flake') : []) {
              const os = dir.split('-')[1]; // flake-<OS>-<suite>
              const tsv = `flake/${dir}/failures.tsv`;
              if (!fs.existsSync(tsv)) continue;
              for (const line of fs.readFileSync(tsv, 'utf8').split('\n').filter(Boolean)) {
                const [id, round, log] = line.split('\t');
                const t = tests.get(id) ?? { rounds: {}, excerpt: '' };
                (t.rounds[os] ??= new Set()).add(round);
                if (!t.excerpt) t.excerpt = excerpt(`flake/${dir}/logs/${log}`, id, `${os}, round ${round}`);
                tests.set(id, t);
              }
            }
            if (tests.size === 0) return;
            const open = (await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 }))
              .filter(i => !i.pull_request);
            for (const [id, t] of tests) {
              const marker = `<!-- flake: ${id} -->`;
              const named = new RegExp(`(^|[^A-Za-z0-9_])${shortName(id)}([^A-Za-z0-9_]|$)`);
              const existing = open.find(i => (i.body ?? '').includes(marker))
                ?? (id.includes('/') ? open.find(i => named.test(i.title) && /flak|timing|timer order|under load/i.test(i.title)) : undefined);
              const counts = Object.entries(t.rounds).map(([os, r]) => `${r.size} of ${process.env.ROUNDS} rounds on ${os}`).join(', ');
              const body = `\`${id}\` failed in ${counts} of the nightly \`flake\` job after ${context.sha.slice(0, 7)}: ${run}\n\n${t.excerpt}`;
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
                core.info(`${id}: commented on #${existing.number}`);
              } else {
                const created = await github.rest.issues.create({
                  ...context.repo,
                  title: `Flaky: ${id}`,
                  labels: ['kind:bug'],
                  body: `${marker}\n${body}\n\nFlaky tests are bugs (maintaining.md): make the test wait on what it observes instead of on timing, or fix the race it found.`,
                });
                core.info(`${id}: opened #${created.data.number}`);
              }
            }

  # Deletes the rust-cache entries no job restores any more: those of another key than
  # `.github/actions/setup/rust-cache-key.sh` gives for main's toolchain and dependencies (and
  # those of the older key scheme), so the live entries are never evicted at the 10 GB limit. A
  # run from another branch only lists what it would delete.
  cache-prune:
    if: (inputs.only || 'all') == 'all' || inputs.only == 'cache'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: delete superseded rust-cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current="v1-rust-$(bash .github/actions/setup/rust-cache-key.sh)-"
          echo "live: ${current}<OS>-<arch>"
          dry=
          [ "$GITHUB_REF" = refs/heads/main ] || { dry=1; echo "not main: nothing is deleted"; }
          gh cache list --limit 1000 --json id,key,sizeInBytes \
            --jq '.[] | "\(.id)\t\(.key)\t\(.sizeInBytes)"' > "$RUNNER_TEMP/caches.tsv"
          freed=0
          while IFS=$'\t' read -r id key size; do
            case "$key" in
              "$current"*) echo "keep    $key" ;;
              v[0-9]*-rust-*)
                echo "delete  $key ($((size >> 20)) MiB)"
                freed=$((freed + size))
                [ -n "$dry" ] || gh cache delete "$id"
                ;;
            esac
          done < "$RUNNER_TEMP/caches.tsv"
          echo "### cache-prune: $((freed >> 20)) MiB of superseded rust-cache entries${dry:+ (dry run)}" >> "$GITHUB_STEP_SUMMARY"
