# Pull requests run the checks their changes need (`cargo xtask check`, rules in
# crates/xtask/src/plan.rs) on Linux, as three parallel jobs: lint (fmt, clippy), test (build,
# unit and integration tests) and golden (end-to-end, debug mode). A change to OS-specific code
# (crates/xtask/src/os.rs) is also linted on Windows and macOS, where `cfg(windows)` and
# `cfg(unix)` code compiles differently: clippy's findings there otherwise surface only in the
# merge queue. The label `ci:full` makes them check everything, the parser's robustness test
# cutting every golden at every character too (add it before pushing, or close and reopen the
# pull request). The WebAssembly goldens run only when the change touches WebAssembly code, in
# pull requests and in the queue; the nightly gate and the checks after merging run them.
#
# The merge queue checks everything against the pull request merged with the latest main: per OS
# one job lints and tests, and the goldens (debug and release mode) are built once and checked in
# parallel shards (queue-goldens.yml). Linux always; Windows and macOS when the change touches
# OS-specific code (crates/xtask/src/os.rs). The single required check is `ci`, which summarizes
# whichever jobs ran. The pull request's text and commits are checked by
# the separate required check `hygiene` (hygiene.yml, which says why it is separate).
#
# Each push to main checks everything on Windows and macOS when the queue checked the change on
# Linux only (opening an issue when that fails), and refreshes the build cache every other run
# restores (a cache saved on a pull request or queue branch can't be restored anywhere else).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  pr:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test, golden]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # HEAD is the merge of the pull request into its base; HEAD^1 is that base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          tools: ${{ matrix.part != 'lint' }}
      - name: cargo xtask check --part ${{ matrix.part }}
        env:
          # `--full` knows no changes, so it leaves the robustness sweep to the environment.
          VELT_ROBUSTNESS: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && 'full' || '' }}
        run: >-
          cargo xtask check --part ${{ matrix.part }} --fast --base HEAD^1
          ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '--full' || '' }}

  # Whether the change touches OS-specific code, so the pull request is linted on Windows and
  # macOS too (xtask builds with the runner's stable Rust in seconds, as for queue-plan).
  pr-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      other_os: ${{ steps.plan.outputs.other_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}; then
            cargo xtask affected --full --github
          else
            cargo xtask affected --base HEAD^1 --github
          fi

  pr-lint-os:
    needs: pr-plan
    if: needs.pr-plan.outputs.other_os != '[]' && needs.pr-plan.outputs.other_os != ''
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.pr-plan.outputs.other_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          tools: false
      - name: cargo xtask check --part lint
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: >-
          cargo xtask check --part lint --fast --base HEAD^1
          ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '--full' || '' }}

  # Which OSes the queue checks. xtask has no dependencies, so the runner's stable Rust builds
  # it in seconds (no pinned toolchain, no cache).
  queue-plan:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      os: ${{ steps.live.outputs.os || steps.plan.outputs.os }}
      # How the parser's robustness test cuts the goldens (`--full` below knows no changes).
      robustness: ${{ steps.plan.outputs.robustness }}
      robustness_files: ${{ steps.plan.outputs.robustness_files }}
      # `skip` unless the change touches WebAssembly code.
      wasm_goldens: ${{ steps.plan.outputs.wasm_goldens }}
      # The golden shards of each OS (crates/xtask/src/os.rs).
      golden_shards: ${{ steps.plan.outputs.golden_shards || '{}' }}
    steps:
      # A queue entry that drops out (fails, is removed, or another one moves ahead of it) makes
      # the queue test the entries behind it again, under new branches, and deletes the old
      # ones. Runs already started for a deleted branch keep going and hold runners the live
      # entries wait for: they check nothing when GitHub says their branch is gone (404 only;
      # any other answer checks as usual, so a live entry is never skipped).
      - id: live
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" || true)
          if [ "$status" = 404 ]; then
            echo "$GITHUB_REF is no longer in the merge queue: nothing to check."
            echo 'os=[]' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.live.outputs.os != '[]'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        if: steps.live.outputs.os != '[]'
        env:
          RUSTUP_TOOLCHAIN: stable
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE" ]; then
            cargo xtask affected --base "$BASE" --github
          else
            cargo xtask affected --full --github
          fi

  queue:
    needs: queue-plan
    if: needs.queue-plan.outputs.os != '[]'
    name: check (${{ matrix.os }})
    strategy:
      # One failed job drops the pull request from the queue: cancel the others at once, so
      # their runners go to the next queue entries instead of finishing a result nobody uses
      # (and `fail-fast` below for the jobs outside this matrix).
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.queue-plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      VELT_ROBUSTNESS: ${{ needs.queue-plan.outputs.robustness }}
      VELT_ROBUSTNESS_FILES: ${{ needs.queue-plan.outputs.robustness_files }}
      VELT_WASM_GOLDENS: ${{ needs.queue-plan.outputs.wasm_goldens }}
    # The slowest job takes about 25 minutes on a cold cache: a runner that hangs fails the queue
    # entry within the hour instead of holding the queue for two.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: cargo xtask check --full --part lint,test
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo xtask check --full --part lint,test
      - if: failure()
        uses: ./.github/actions/fail-fast
        with:
          job: check (${{ matrix.os }})

  # The goldens: per OS a build, then shards (queue-goldens.yml).
  queue-golden:
    needs: queue-plan
    if: needs.queue-plan.outputs.os != '[]'
    name: golden (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.queue-plan.outputs.os) }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/queue-goldens.yml
    with:
      os: ${{ matrix.os }}
      shards: ${{ toJSON(fromJSON(needs.queue-plan.outputs.golden_shards)[matrix.os]) }}

  # Which OSes the push to main checks. The queue tested this commit against its base_sha, which
  # is HEAD^1 here, so `affected --base HEAD^1` is the queue's plan: Windows and macOS run when it
  # checked Linux only (or the change refreshes their build cache; crates/xtask/src/os.rs).
  main-plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      os: ${{ steps.plan.outputs.main_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo xtask affected --base HEAD^1 --github

  # After each push to main: on Linux the build cache, saved even when a check fails; on Windows
  # and macOS the whole gate (and their caches) when main-plan says the queue didn't run it there.
  # Without a plan (main-plan failed) every OS runs.
  main:
    needs: main-plan
    if: ${{ !cancelled() && github.event_name == 'push' }}
    name: main (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(needs.main-plan.outputs.os
          || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      # Tools on Linux too, though it runs no tests: the wasmtime cache saved here is the one
      # every branch can restore.
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
      # Linux: the queue checked it in full, so only build and lint what the gate builds, plus the
      # WebAssembly runtime the tests build.
      - name: build the cache (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --workspace --exclude xtask --all-targets
          cargo clippy --workspace --all-targets
          cargo build -p velt_rt_wasm --target wasm32-wasip1
          cargo build -p velt_rt_wasm --target wasm32-unknown-unknown
          cargo build -p xtask
      - name: cargo xtask check --full
        if: runner.os != 'Linux'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo xtask check --full
      - name: report the failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const os = '${{ runner.os }}';
            const title = `main fails on ${os}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The gate failed on ${os} after ${context.sha.slice(0, 7)}: ${run}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

  ci:
    if: always()
    needs: [pr, pr-plan, pr-lint-os, queue-plan, queue, queue-golden]
    runs-on: ubuntu-latest
    steps:
      - name: every gate that ran passed
        run: |
          for r in "${{ needs.pr.result }}" "${{ needs.pr-plan.result }}" "${{ needs.pr-lint-os.result }}" \
            "${{ needs.queue-plan.result }}" "${{ needs.queue.result }}" "${{ needs.queue-golden.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a gate failed: $r"; exit 1 ;; esac
          done
