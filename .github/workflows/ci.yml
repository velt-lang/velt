# Pull requests run the checks their changes need (`cargo xtask check`, rules in
# crates/xtask/src/plan.rs) on Linux, as three parallel jobs: lint (fmt, clippy), test (build,
# unit and integration tests) and golden (end-to-end, debug mode). The label `ci:full` makes them
# check everything (add it before pushing, or close and reopen the pull request).
#
# The merge queue checks everything against the pull request merged with the latest main, as two
# jobs per OS (lint and tests; goldens in debug and release mode). Linux always; Windows and macOS
# when the change touches OS-specific code (crates/xtask/src/os.rs). The single required check is
# `ci`, which summarizes whichever jobs ran.
#
# Each push to main checks everything on Windows and macOS (opening an issue when that fails),
# which covers the changes the queue checked on Linux only, and refreshes the build cache every
# other run restores (a cache saved on a pull request or queue branch can't be restored anywhere
# else).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  pr:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [lint, test, golden]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # HEAD is the merge of the pull request into its base; HEAD^1 is that base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          tools: ${{ matrix.part != 'lint' }}
      - name: cargo xtask check --part ${{ matrix.part }}
        run: >-
          cargo xtask check --part ${{ matrix.part }} --fast --base HEAD^1
          ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '--full' || '' }}

  # Which OSes the queue checks. xtask has no dependencies, so the runner's stable Rust builds
  # it in seconds (no pinned toolchain, no cache).
  queue-plan:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      os: ${{ steps.plan.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          RUSTUP_TOOLCHAIN: stable
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ -n "$BASE" ]; then
            cargo xtask affected --base "$BASE" --github
          else
            cargo xtask affected --full --github
          fi

  queue:
    needs: queue-plan
    name: ${{ matrix.part }} (${{ matrix.os }})
    strategy:
      # One failed job drops the pull request from the queue: cancel the others at once, so
      # their runners go to the next queue entries instead of finishing a result nobody uses.
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.queue-plan.outputs.os) }}
        part: [check, golden]
        include:
          - part: check
            args: --part lint,test
          - part: golden
            args: --part golden
    runs-on: ${{ matrix.os }}
    # The slowest job takes about 25 minutes on a cold cache: a runner that hangs fails the queue
    # entry within the hour instead of holding the queue for two.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: cargo xtask check --full ${{ matrix.args }}
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo xtask check --full ${{ matrix.args }}

  # After each push to main: the whole gate on Windows and macOS (the queue may have checked the
  # change on Linux only), and on all three OSes the build cache, saved even when a check fails.
  main:
    if: github.event_name == 'push'
    name: main (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: ${{ matrix.os != 'ubuntu-latest' }}
          save-cache: "true"
      # Linux: the queue checked it in full, so only build and lint what the gate builds, plus the
      # WebAssembly runtime the tests build.
      - name: build the cache (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --workspace --exclude xtask --all-targets
          cargo clippy --workspace --all-targets
          cargo build -p velt_rt_wasm --target wasm32-wasip1
          cargo build -p velt_rt_wasm --target wasm32-unknown-unknown
          cargo build -p xtask
      - name: cargo xtask check --full
        if: runner.os != 'Linux'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo xtask check --full
      - name: report the failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const os = '${{ runner.os }}';
            const title = `main fails on ${os}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The gate failed on ${os} after ${context.sha.slice(0, 7)}: ${run}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

  ci:
    if: always()
    needs: [pr, queue-plan, queue]
    runs-on: ubuntu-latest
    steps:
      - name: every gate that ran passed
        run: |
          for r in "${{ needs.pr.result }}" "${{ needs.queue-plan.result }}" "${{ needs.queue.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a gate failed: $r"; exit 1 ;; esac
          done
