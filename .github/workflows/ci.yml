# Pull requests run the checks their changes need (`cargo xtask check`, rules in
# crates/xtask/src/plan.rs) on Linux, as three parallel jobs: lint (fmt, clippy), test (build,
# unit and integration tests) and golden (end-to-end, debug mode). A change to OS-specific code
# (crates/xtask/src/os.rs) is also linted on Windows, where `cfg(windows)` code compiles
# differently, and on macOS when it can really differ there: clippy's findings there otherwise
# surface only in the merge queue. The test files a pull request adds or edits run 20 times at once under load
# (`cargo xtask repeat`), in the `test` job and on Windows (`pr-windows`, which also runs the
# package tests when the change touches a package, networking, timers or the test runner): a test
# ordering events by timing fails there, not in the queue. The label `ci:full` makes them check
# everything, the parser's robustness test cutting every golden at every character too (add it
# before pushing, or close and reopen the pull request). The WebAssembly goldens run only when
# the change touches WebAssembly code, in pull requests and in the queue; the nightly runs them
# all (on Linux, Windows and macOS). The checks after merging leave them to it.
#
# The merge queue checks everything against the pull request merged with the latest main: per OS
# one job lints and tests, and the goldens (debug and release mode) are built once and checked in
# parallel shards (queue-goldens.yml), as are the WebAssembly goldens when the change touches
# WebAssembly code (shards of their own from the same build; the `check` job leaves them out).
# Linux always; Windows when the change touches OS-specific code; macOS only when it touches code
# that really can differ there, because a macOS job can wait for a runner that never comes and
# fail the entry with no test failing (crates/xtask/src/os.rs). The single required check is `ci`, which summarizes whichever jobs
# ran. The pull request's text and commits are checked by
# the separate required check `hygiene` (hygiene.yml, which says why it is separate).
#
# A scheduled run checks everything on Windows and macOS once a day (opening an issue when that
# fails, with the commits since the last run that passed): runners are the limit, and the runtime,
# code generation and linking have met those OSes in the queue already. A break only macOS shows
# in any other code first appears there, after the merge. A tag runs it again before
# a release (release.yml). Each push to main refreshes the build cache and, on Linux, clang's objects
# for the goldens, which every other run restores (a cache saved on a pull request or queue branch
# can't be restored anywhere else), on Windows and
# macOS too when the toolchain or the dependencies changed, and a commit no passing queue run
# tested checks every OS.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

# The scheduled run has a group of its own: a push to main must not replace it while it waits.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'nightly') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  pr:
    if: github.event_name == 'pull_request'
    name: ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        # 2026-11-13 (owner, #2649 switch): pull requests run lint only; the merge queue runs the
        # whole gate on three OSes. Put test and golden back when the move is done.
        part: [lint]
    runs-on: ubuntu-latest
    # A change to velt_common or sema selects the whole suite: its test part alone runs about
    # 70 minutes on a hosted runner, and the changed tests then repeat under load (#2652 hit 90).
    timeout-minutes: 150
    steps:
      # HEAD is the merge of the pull request into its base; HEAD^1 is that base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          tools: ${{ matrix.part != 'lint' }}
      # The pinned zig, from the Actions cache, only when this part's tests build a package's C
      # `sources` (packages/sqlite and what uses it: crates/xtask/src/zig.rs). Lint builds none.
      - name: does this part build C sources?
        id: plan
        if: matrix.part != 'lint'
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}; then
            cargo xtask affected --full --github
          else
            cargo xtask affected --base HEAD^1 --github
          fi
      - uses: ./.github/actions/zig
        if: >-
          (matrix.part == 'test' && steps.plan.outputs.zig_tests == 'true')
          || (matrix.part == 'golden' && steps.plan.outputs.zig_goldens == 'true')
        with:
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - name: cargo xtask check --part ${{ matrix.part }}
        env:
          # `--full` knows no changes, so it leaves the robustness sweep to the environment.
          VELT_ROBUSTNESS: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && 'full' || '' }}
        run: >-
          cargo xtask check --part ${{ matrix.part }} --fast --base HEAD^1
          ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '--full' || '' }}
      # The test files the change adds or edits (velt test files, goldens), 50 times each at once
      # on twice as many threads as the runner has cores beside a spinning thread per core, from
      # the build above: a test that orders events by timing fails here instead of in the merge
      # queue (crates/xtask/src/repeat.rs). 50, not the default 20: on the 4-vCPU runner a race
      # with a few milliseconds of slack passed 20 runs. With no test file changed it says so and
      # stops, before building anything.
      - name: cargo xtask repeat (the changed tests, under load)
        if: matrix.part == 'test'
        run: cargo xtask repeat --base HEAD^1 --times 50

  # Whether the change touches OS-specific code, so the pull request is linted on Windows or
  # macOS too (`other_os`, xtask builds with the runner's stable Rust in seconds, as for queue-plan).
  pr-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      other_os: ${{ steps.plan.outputs.other_os }}
      # `true` when the change adds or edits a test file (`cargo xtask repeat` has work).
      repeat: ${{ steps.plan.outputs.repeat }}
      # The packages whose tests run on Windows (`all`, names, or empty; os.rs).
      windows_packages: ${{ steps.plan.outputs.windows_packages }}
      # The goldens (`VELT_GOLDEN`) of the apps that build a package's C `sources`, run on Windows
      # with the apps' `velt test` when the change touches such a package or its build (zig.rs).
      windows_apps: ${{ steps.plan.outputs.windows_apps }}
      # `true` when those tests or the repeated files build C `sources` (crates/xtask/src/zig.rs).
      windows_zig: ${{ steps.plan.outputs.windows_zig }}
      # `true` when the change touches what the header check checks (`c-headers`).
      c_headers: ${{ steps.plan.outputs.c_headers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}; then
            cargo xtask affected --full --github
          else
            cargo xtask affected --base HEAD^1 --github
          fi

  pr-lint-os:
    needs: pr-plan
    if: needs.pr-plan.outputs.other_os != '[]' && needs.pr-plan.outputs.other_os != ''
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.pr-plan.outputs.other_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          tools: false
      - name: cargo xtask check --part lint
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: >-
          cargo xtask check --part lint --fast --base HEAD^1
          ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') && '--full' || '' }}

  # Windows, where timing differs most (timer resolution, sockets, process start-up), for the
  # changes where that matters, before the merge queue: the changed test files repeated under
  # load (`cargo xtask repeat`, as the `test` job does on Linux), and the package tests when the
  # change touches a package, networking, timers or the test runner (`windows_packages` in
  # crates/xtask/src/os.rs), and the apps that build a package's C `sources` when the change
  # touches such a package or its build (`windows_apps` in crates/xtask/src/zig.rs: there the
  # package is a dependency, at a canonical path). Any other change starts no Windows runner.
  pr-windows:
    needs: pr-plan
    # Off while pull requests run lint only (the `pr` job); the merge queue covers Windows.
    if: >-
      false && (
      needs.pr-plan.outputs.repeat == 'true' || needs.pr-plan.outputs.windows_packages != ''
      || needs.pr-plan.outputs.windows_apps != '')
    name: windows (changed tests under load, packages)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          tools: false
      - uses: ./.github/actions/zig
        if: needs.pr-plan.outputs.windows_zig == 'true'
        with:
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      # What both steps run, resolved as the gate's `--all-targets` build (a test target resolves
      # the dev-dependencies' features), so neither builds again.
      - name: build
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: >-
          cargo build --workspace --exclude xtask --lib --bins --test golden --test packages
          --test example_apps
      # The C bundles the tests below link, each built once before them, as `cargo xtask check`
      # does before the goldens (`bundle_builds` in crates/xtask/src/zig.rs): a cold build of
      # SQLite takes longer than the 120 s the golden harness gives a build (#2347).
      - name: C bundles
        if: needs.pr-plan.outputs.windows_zig == 'true'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: (cd packages/sqlite && ../../target/debug/velt native build)
      - name: package tests (${{ needs.pr-plan.outputs.windows_packages }})
        if: needs.pr-plan.outputs.windows_packages != ''
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          VELT_RT_PREBUILT: "1"
          PACKAGES: ${{ needs.pr-plan.outputs.windows_packages }}
        run: |
          [ "$PACKAGES" = all ] || export VELT_PACKAGES="$PACKAGES"
          cargo test --workspace --test packages -- --nocapture
      - name: apps with C sources (${{ needs.pr-plan.outputs.windows_apps }})
        if: needs.pr-plan.outputs.windows_apps != ''
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          VELT_RT_PREBUILT: "1"
          VELT_GOLDEN: ${{ needs.pr-plan.outputs.windows_apps }}
        run: |
          cargo test --workspace --test golden -- --nocapture
          cargo test --workspace --test example_apps -- --nocapture
      - name: cargo xtask repeat (the changed tests, under load)
        if: needs.pr-plan.outputs.repeat == 'true'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        # The binary, not `cargo xtask`: on Windows `cargo run` puts directories in front of
        # `PATH`, which the C dependencies' build scripts watch, so the build above would compile
        # them again (3 minutes).
        run: |
          cargo build -q -p xtask
          target/debug/xtask repeat --base HEAD^1

  # Which OSes the queue checks. xtask has no dependencies, so the runner's stable Rust builds
  # it in seconds (no pinned toolchain, no cache).
  queue-plan:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      os: ${{ steps.live.outputs.os || steps.plan.outputs.os }}
      # How the parser's robustness test cuts the goldens (`--full` below knows no changes).
      robustness: ${{ steps.plan.outputs.robustness }}
      robustness_files: ${{ steps.plan.outputs.robustness_files }}
      # The same for the formatter's corpus.
      fmt_corpus: ${{ steps.plan.outputs.fmt_corpus }}
      fmt_corpus_files: ${{ steps.plan.outputs.fmt_corpus_files }}
      # `all` when the code describing variables changed: every golden, not the sample.
      debug_vars: ${{ steps.plan.outputs.debug_vars }}
      # `skip` unless the change touches WebAssembly code.
      wasm_goldens: ${{ steps.plan.outputs.wasm_goldens }}
      # How much of the VIR identity runs: empty for all of it, `sample`, or `skip`.
      vir_identity: ${{ steps.plan.outputs.vir_identity }}
      # `true` when the change touches what the header check checks (`c-headers`).
      c_headers: ${{ steps.plan.outputs.c_headers }}
      # The golden shards and the WebAssembly goldens' shards of each OS (crates/xtask/src/os.rs).
      golden_shards: ${{ steps.plan.outputs.golden_shards || '{}' }}
      wasm_shards: ${{ steps.plan.outputs.wasm_shards || '{}' }}
    steps:
      # A queue entry that drops out (fails, is removed, or another one moves ahead of it) makes
      # the queue test the entries behind it again, under new branches, and deletes the old
      # ones. Runs already started for a deleted branch keep going and hold runners the live
      # entries wait for: they check nothing when GitHub says their branch is gone (404 only;
      # any other answer checks as usual, so a live entry is never skipped).
      - id: live
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}" || true)
          if [ "$status" = 404 ]; then
            echo "$GITHUB_REF is no longer in the merge queue: nothing to check."
            echo 'os=[]' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.live.outputs.os != '[]'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        if: steps.live.outputs.os != '[]'
        env:
          RUSTUP_TOOLCHAIN: stable
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # Plan against `main`, not against this group's parent. A green group merges the entries
          # ahead of it too, even one whose own run failed, so it must check what they need as well.
          if [ -n "$BASE" ]; then
            git fetch --quiet origin main
            BASE=$(git merge-base HEAD origin/main || echo "$BASE")
            cargo xtask affected --base "$BASE" --github
          else
            cargo xtask affected --full --github
          fi

  queue:
    needs: queue-plan
    if: needs.queue-plan.outputs.os != '[]'
    name: check (${{ matrix.os }})
    strategy:
      # One failed job drops the pull request from the queue: cancel the others at once, so
      # their runners go to the next queue entries instead of finishing a result nobody uses
      # (and `fail-fast` below for the jobs outside this matrix).
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.queue-plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    env:
      VELT_ROBUSTNESS: ${{ needs.queue-plan.outputs.robustness }}
      VELT_ROBUSTNESS_FILES: ${{ needs.queue-plan.outputs.robustness_files }}
      VELT_FMT_CORPUS: ${{ needs.queue-plan.outputs.fmt_corpus }}
      VELT_FMT_CORPUS_FILES: ${{ needs.queue-plan.outputs.fmt_corpus_files }}
      VELT_DEBUG_VARS: ${{ needs.queue-plan.outputs.debug_vars }}
      VELT_VIR_IDENTITY: ${{ needs.queue-plan.outputs.vir_identity }}
      # The WebAssembly goldens run in shards of their own (`queue-golden`).
      VELT_WASM_GOLDENS: skip
    # The slowest job (Windows) took 58 to 74 minutes on 2026-11-07, and 75 on a slower runner,
    # cancelled in its last steps with every test passing so far: a runner that hangs still fails
    # the queue entry well within two hours.
    timeout-minutes: 100
    steps:
      # With its parent: std-lint compares the allow lists with the change's base (`HEAD^1`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      # `--full` runs every package's tests, the example apps' and the benchmarks', and those
      # build packages/sqlite's C sources: the plan selects zig for every such run
      # (crates/xtask/src/zig.rs).
      - uses: ./.github/actions/zig
        with:
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      # The pinned Miniflare and workerd, so the Worker test (crates/veltc/tests/workerd.rs) runs
      # under workerd here (VELT_WORKERD below); its timings run nightly.
      - name: npm ci (tests/workerd, Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}/tests/workerd
        # No install scripts: workerd's would fetch its binary outside the lockfile's hashes; the
        # lockfile's platform package has it.
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: cargo xtask check --full --part lint,test
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        env:
          # The Worker test fails instead of skipping when the packages are missing (Linux).
          VELT_WORKERD: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo xtask check --full --part lint,test --base HEAD^1
      # For the push to main that follows (`clang-objects`): a failure here must not fail the entry.
      - name: the objects clang compiled (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: bash .github/actions/setup/clang-objects.sh pack clang-objects.tar
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: clang-objects-check
          path: clang-objects.tar
          compression-level: 1
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
      - if: failure()
        uses: ./.github/actions/fail-fast
        with:
          job: check (${{ matrix.os }})

  # The goldens: per OS a build, then shards (queue-goldens.yml); the WebAssembly goldens too,
  # unless the plan skips them (`wasm_goldens`: no WebAssembly code changed).
  queue-golden:
    needs: queue-plan
    if: needs.queue-plan.outputs.os != '[]'
    name: golden (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.queue-plan.outputs.os) }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/queue-goldens.yml
    with:
      os: ${{ matrix.os }}
      shards: ${{ toJSON(fromJSON(needs.queue-plan.outputs.golden_shards)[matrix.os]) }}
      # Every golden, the example apps' that build packages/sqlite's C sources among them.
      zig: true
      wasm_shards: >-
        ${{ needs.queue-plan.outputs.wasm_goldens == 'skip' && '[]'
        || toJSON(fromJSON(needs.queue-plan.outputs.wasm_shards)[matrix.os]) }}

  # Which OSes the push to main checks. Only a commit the merge queue tested (a ci run on it that
  # passed: the queue's head is the commit that lands) can skip any; a direct push or an admin
  # merge runs every OS. The queue tested it against its base_sha, which is HEAD^1 here, so
  # `affected --base HEAD^1` is the queue's plan: Windows and macOS run when the change refreshes
  # their build cache (crates/xtask/src/os.rs). No plan: every OS.
  main-plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      os: ${{ steps.plan.outputs.main_os }}
      # The queue run that passed on this commit, whose artifacts hold what clang compiled.
      queue_run: ${{ steps.queued.outputs.run }}
    steps:
      - id: queued
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          runs= run=
          for _ in 1 2 3; do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=merge_group&status=success" \
              --jq '"\(.total_count) \(.workflow_runs[0].id // "")"') && { read -r runs run <<< "$found"; break; }
            runs=; sleep 10
          done
          echo "merge queue runs that passed on $SHA: ${runs:-unknown}"
          echo "tested=$([ "${runs:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.queued.outputs.tested == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        if: steps.queued.outputs.tested == 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo xtask affected --base HEAD^1 --github

  # What clang compiled in the queue run that tested this commit, added to the newest entry and
  # saved, so the next queue entry restores it: a queue branch can't save a cache another branch
  # restores (maintaining.md "Merging"). What a queue job uploaded gets no more than a job with
  # nothing else in its workspace, only this script from the commit, and no token in `.git/config`:
  # `actions: write` to delete old entries stays out of the gate's jobs. No artifact (the commit
  # compiled nothing new) saves nothing. Any failure stops the job before the save, which leaves the
  # newest entry as it was and costs the queue a staler cache, not a red `main`.
  clang-objects:
    needs: main-plan
    if: github.event_name == 'push' && needs.main-plan.outputs.queue_run != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci
          sparse-checkout: .github/actions/setup/clang-objects.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The same `path` as setup's restore: it is part of what a cache entry is found by. A miss
      # must save nothing: this commit's objects alone would replace the whole entry as the newest.
      - uses: actions/cache/restore@v4
        with:
          path: target/velt-build-cache/v*/llvm
          key: velt-clang-objects-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: velt-clang-objects-${{ runner.os }}-${{ runner.arch }}-
          fail-on-cache-miss: true
      - name: clang's objects from the queue
        env:
          RUN: ${{ needs.main-plan.outputs.queue_run }}
        run: |
          gh run download "$RUN" --pattern 'clang-objects-*' --dir "$RUNNER_TEMP/clang-objects"
          bash ci/.github/actions/setup/clang-objects.sh unpack "$RUNNER_TEMP/clang-objects"
      - uses: actions/cache/save@v4
        with:
          path: target/velt-build-cache/v*/llvm
          key: velt-clang-objects-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
      # Each is a whole copy, about 1% of the 10 GB limit. Two stay: a job may be restoring the
      # older one.
      - name: only the newest clang objects stay
        run: |
          gh cache list --ref refs/heads/main --key "velt-clang-objects-$RUNNER_OS-$RUNNER_ARCH-" \
            --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' |
            while read -r id; do gh cache delete "$id"; done

  # After each push to main: on Linux the build cache, saved even when a check fails; on Windows
  # and macOS the whole gate (and their caches) when main-plan says so. Without a plan (not a queue
  # commit, or main-plan failed) every OS runs. The scheduled run is Windows and macOS.
  main:
    needs: main-plan
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') }}
    name: main (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' && '["windows-latest","macos-latest"]')
          || needs.main-plan.outputs.os
          || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    # The whole gate without the WebAssembly goldens took 107 minutes on Windows (2026-11-07), and a
    # slow runner takes half as long again.
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      # Tools on Linux too, though it runs no tests: the wasmtime cache saved here is the one
      # every branch can restore.
      - uses: ./.github/actions/setup
        with:
          save-cache: "true"
          code-cache: "false"
      # Linux: the queue checked it in full, so only build and lint what the gate builds, plus the
      # WebAssembly runtime the tests build.
      - name: build the cache (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --workspace --exclude xtask --all-targets
          cargo clippy --workspace --all-targets
          cargo build -p velt_rt_wasm --target wasm32-wasip1
          cargo build -p velt_rt_wasm --target wasm32-unknown-unknown
          cargo build -p xtask
      # The whole gate builds packages/sqlite's C sources (crates/xtask/src/zig.rs); Linux's
      # build above doesn't.
      - uses: ./.github/actions/zig
        if: runner.os != 'Linux'
        with:
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      - name: cargo xtask check --full
        if: runner.os != 'Linux'
        shell: bash
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        # nightly.yml's wasm-goldens job runs the WebAssembly goldens on these OSes every night. In
        # this job they take most of an hour: with them, 7 of 20 runs from 2026-11-04 to 2026-11-07
        # hit the time limit before finishing the goldens.
        env:
          VELT_WASM_GOLDENS: skip
        run: cargo xtask check --full
      # A job that hits its time limit ends cancelled, not failed, and checked less than it should
      # have: that gets the issue too. Nothing else cancels these runs but a person.
      - name: report the failure
        if: failure() || cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            const os = '${{ runner.os }}';
            const title = `main fails on ${os}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const how = '${{ job.status }}' === 'cancelled' ? 'did not finish (time limit, or cancelled)' : 'failed';
            let body = `The gate ${how} on ${os} after ${context.sha.slice(0, 7)}: ${run}`;
            if (context.eventName === 'schedule') {
              const passed = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', event: 'schedule', status: 'success', per_page: 1 });
              const last = passed.data.workflow_runs[0];
              if (last) {
                body += `\nCommits since the last scheduled run that passed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/compare/${last.head_sha}...${context.sha}`;
              }
            }
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

  # `declare c` against C headers, C constants and C `sources` through the pinned zig, for every
  # target from this one Linux job (crates/veltc/tests/c_headers.rs, c_constants.rs,
  # c_sources.rs and c_export.rs, which VELT_ZIG_TESTS turns on and makes fail without VELT_ZIG; the other jobs'
  # tests leave them out, crates/xtask/src/c_headers.rs's TESTS). It runs only when the
  # change touches what it checks (crates/xtask/src/c_headers.rs), in pull requests and in
  # the queue: anything else doesn't download zig. The nightly runs it whatever changed.
  c-headers:
    needs: [pr-plan, queue-plan]
    if: always() && (needs.pr-plan.outputs.c_headers == 'true' || needs.queue-plan.outputs.c_headers == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tools: false
      - uses: ./.github/actions/zig
        with:
          working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
      # The tests that link a program need the runtime, which `cargo test` doesn't build.
      - name: the runtime
        run: cargo build -p velt_rt
      - name: declarations against headers, C constants and sources, every target
        env:
          VELT_ZIG_TESTS: "1"
        run: cargo test --workspace --test c_headers --test c_constants --test c_sources --test c_export -- --nocapture

  ci:
    if: always()
    needs: [pr, pr-plan, pr-lint-os, pr-windows, queue-plan, queue, queue-golden, c-headers]
    runs-on: ubuntu-latest
    steps:
      - name: every gate that ran passed
        run: |
          for r in "${{ needs.pr.result }}" "${{ needs.pr-plan.result }}" "${{ needs.pr-lint-os.result }}" \
            "${{ needs.pr-windows.result }}" "${{ needs.queue-plan.result }}" "${{ needs.queue.result }}" "${{ needs.queue-golden.result }}" \
            "${{ needs.c-headers.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a gate failed: $r"; exit 1 ;; esac
          done
      # Fail closed in the queue: unless queue-plan found the entry gone (`os` is `[]`), the
      # checks and the goldens must have run and passed, not been skipped.
      - name: the queue checked and ran the goldens
        if: needs.queue-plan.result == 'success' && needs.queue-plan.outputs.os != '[]'
        run: |
          echo "queue: ${{ needs.queue.result }}, queue-golden: ${{ needs.queue-golden.result }}"
          [ "${{ needs.queue.result }}" = success ] && [ "${{ needs.queue-golden.result }}" = success ]
