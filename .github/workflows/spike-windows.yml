# TEMPORARY (#853 review): Windows link times with bench/compile/run.ps1 -LinkOnly, from the
# toolchain archive of release run 37930536191, with Defender's status. Removed afterwards.
name: spike
on:
  push:
    branches: ["spike/**"]
jobs:
  winbench:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bundled-linker
      - uses: actions/download-artifact@v4
        with:
          name: velt-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/dist
          run-id: 37930536191
          github-token: ${{ github.token }}
      - name: bench
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name
          Get-MpComputerStatus | Select-Object AMServiceEnabled, RealTimeProtectionEnabled, AntivirusEnabled | Format-List | Out-Host
          Expand-Archive "$env:RUNNER_TEMP/dist/*.zip" -DestinationPath "$env:RUNNER_TEMP/tc"
          $velt = (Get-ChildItem "$env:RUNNER_TEMP/tc/*/bin/velt.exe").FullName
          foreach ($l in "system", "bundled") {
            Write-Host "### VELT_LINKER=$l"
            $env:VELT_LINKER = $l
            pwsh -NoProfile -File bench/compile/run.ps1 -Runs 5 -Units 1000 -Velt $velt -LinkOnly
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Write-Host "### first start of the bundled lld after a fresh copy (Defender scans new files)"
          $copy = Join-Path $env:RUNNER_TEMP "lld-copy.exe"; Copy-Item (Get-ChildItem "$env:RUNNER_TEMP/tc/*/lib/velt/lld.exe").FullName $copy
          foreach ($i in 1..3) { $t = Measure-Command { & $copy -flavor link /? | Out-Null }; Write-Host "lld start $i: $([math]::Round($t.TotalMilliseconds)) ms" }
