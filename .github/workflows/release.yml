# Release: pushing a tag v<version> (the workspace version in Cargo.toml) builds the toolchain
# for every supported platform (bundling the lld from lld.yml), installs each archive with
# scripts/get-velt.* and smoke-tests it, also on machines without a C toolchain (clean-machine),
# publishes a GitHub release with the archives, SHA256SUMS and the installers, then installs the
# published release on every platform. Running the workflow by hand (workflow_dispatch) builds and
# tests the archives and keeps them as workflow artifacts without publishing anything.
# See CONTRIBUTING.md "Releases".
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: version (and the tag matches it)
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          [ -n "$version" ] || { echo "no version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (Cargo.toml)"
            exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  # The bundled linker, per target (cached: it is rebuilt only when scripts/build-lld.* change).
  lld:
    uses: ./.github/workflows/lld.yml

  build:
    needs: [version, lld]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in Debian 11 (glibc 2.31), so the toolchain runs on that glibc or
          # newer (Ubuntu 20.04+, Debian 11+, RHEL 9, Amazon Linux 2023).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            container: debian:bullseye
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: debian:bullseye
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 120
    steps:
      - name: build tools (Debian container)
        if: matrix.container
        run: |
          # Debian 11 is past its support: deb.debian.org no longer has the security updates the
          # image was built with (404). The image lists the matching snapshot.debian.org sources
          # (commented out); use those.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] || continue
            sed -i 's|^deb http://deb.debian.org|# deb http://deb.debian.org|; s|^# deb http://snapshot|deb [check-valid-until=no] http://snapshot|' "$f"
          done
          apt-get update -q
          apt-get install -y -q --no-install-recommends build-essential git curl ca-certificates musl-tools
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lld-${{ matrix.target }}
          path: ${{ runner.temp }}/lld
      - name: rust (pinned)
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' -sSf https://sh.rustup.rs |
              sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # The checkout belongs to another user inside the container; `velt --version` embeds
          # the commit only if git trusts it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rustup toolchain install
          rustc -vV
          host=$(rustc -vV | sed -n 's/^host: *//p')
          [ "$host" = "${{ matrix.target }}" ] || { echo "::error::host $host, expected ${{ matrix.target }}"; exit 1; }

      - name: package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x "$RUNNER_TEMP/lld/lld"
          scripts/package.sh --lld "$RUNNER_TEMP/lld/lld"
      - name: package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -Lld "$env:RUNNER_TEMP/lld/lld.exe"

      - name: install the archive and smoke-test it (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          prefix="$RUNNER_TEMP/velt"
          sh scripts/get-velt.sh --no-modify-path --prefix "$prefix" \
            --archive "dist/velt-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          "$prefix/bin/velt" --version
          scripts/smoke.sh "$prefix/bin/velt"
      - name: install the archive and smoke-test it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Prefix = Join-Path $env:RUNNER_TEMP "velt"
          & ./scripts/get-velt.ps1 -NoModifyPath -Prefix $Prefix `
            -Archive "dist/velt-${{ needs.version.outputs.version }}-${{ matrix.target }}.zip"
          $Velt = Join-Path $Prefix "bin\velt.exe"
          function Run { & $Velt @args; if ($LASTEXITCODE -ne 0) { throw "velt $args failed" } }
          Run --version
          Run doctor
          $Work = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force $Work | Out-Null
          Set-Location $Work
          Run new demo
          Set-Location demo
          Run run
          Run run --release

      - uses: actions/upload-artifact@v4
        with:
          name: velt-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # The archive on a machine without a C toolchain (#803): Debian slim (no build-essential), a
  # Windows Server Core container (no Visual Studio, SDK or Visual C++ runtime), and macOS with
  # the bundled linker forced (the runners' Xcode cannot be removed). scripts/smoke-clean.*.
  clean-machine:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: velt-${{ matrix.target }}
          path: dist
      - name: Debian slim (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -xzf dist/velt-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          arch=${{ matrix.target }}; arch=${arch%%-*}
          docker run --rm -v "$RUNNER_TEMP/velt-${{ needs.version.outputs.version }}-${{ matrix.target }}:/velt:ro" \
            -v "$PWD:/repo:ro" debian:bookworm-slim \
            bash /repo/scripts/smoke-clean.sh /velt/bin/velt "$arch-unknown-linux-musl"
      - name: bundled linker (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -xzf dist/velt-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz -C "$RUNNER_TEMP"
          scripts/smoke-clean.sh "$RUNNER_TEMP/velt-${{ needs.version.outputs.version }}-${{ matrix.target }}/bin/velt"
      - name: Windows Server Core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Name = "velt-${{ needs.version.outputs.version }}-${{ matrix.target }}"
          Expand-Archive "dist/$Name.zip" -DestinationPath $env:RUNNER_TEMP
          # Some runner images leave the Docker service stopped.
          if ((Get-Service docker -ErrorAction SilentlyContinue).Status -ne "Running") { Start-Service docker }
          docker run --rm -v "$env:RUNNER_TEMP\${Name}:C:\velt" -v "${PWD}:C:\repo" `
            mcr.microsoft.com/windows/servercore:ltsc2025 `
            powershell -NoProfile -ExecutionPolicy Bypass -File C:\repo\scripts\smoke-clean.ps1 C:\velt\bin\velt.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    if: github.ref_type == 'tag'
    needs: [version, build, clean-machine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: velt-*
          path: assets
          merge-multiple: true
      - name: installers, checksums and notes
        run: |
          for f in get-velt.sh get-velt.ps1; do
            sed "s/@VELT_RELEASE_VERSION@/$VERSION/" "scripts/$f" > "assets/$f"
          done
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "## Install"
            echo
            echo "Linux and macOS:"
            echo
            echo '```sh'
            echo "curl -fsSL $base/get-velt.sh | sh"
            echo '```'
            echo
            echo "Windows (PowerShell):"
            echo
            echo '```powershell'
            echo "irm $base/get-velt.ps1 | iex"
            echo '```'
            echo
            echo "Then run \`velt doctor\`. The toolchain brings its own linker: no Visual Studio Build Tools,"
            echo "Xcode or C compiler needed"
            echo "([Platforms and installation](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/tooling/platforms.md))."
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
          } > notes.md
      - name: publish the release
        run: |
          flags=
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then flags=--prerelease; fi
          gh release create "$GITHUB_REF_NAME" assets/* --verify-tag $flags \
            --title "Velt $VERSION" --notes-file notes.md

  # Install the published release the way users will, on every platform.
  verify:
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      VELT_INSTALL_BASE_URL: https://github.com/${{ github.repository }}
    steps:
      - name: install with get-velt.sh (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "$VELT_INSTALL_BASE_URL/releases/download/$GITHUB_REF_NAME/get-velt.sh" | sh
          velt="$HOME/.velt/toolchain/bin/velt"
          "$velt" --version | grep -F "velt ${{ needs.version.outputs.version }} "
          "$velt" doctor
          cd "$RUNNER_TEMP" && "$velt" new demo && cd demo && "$velt" run
      - name: install with get-velt.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          irm "$env:VELT_INSTALL_BASE_URL/releases/download/$env:GITHUB_REF_NAME/get-velt.ps1" | iex
          $Velt = Join-Path $env:LOCALAPPDATA "velt\bin\velt.exe"
          function Run { & $Velt @args; if ($LASTEXITCODE -ne 0) { throw "velt $args failed" } }
          $v = Run --version
          if ($v -notlike "velt ${{ needs.version.outputs.version }} *") { throw "unexpected version: $v" }
          Run doctor
          Set-Location $env:RUNNER_TEMP
          Run new demo
          Set-Location demo
          Run run
