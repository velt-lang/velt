[package]
name = "chat-load"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the Velt workspace (it only exists to load the servers).
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
# wss://: rustls (ring provider) with a root store from the CA file in env CA.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
