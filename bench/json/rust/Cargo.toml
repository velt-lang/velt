[package]
name = "json_bench"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the Velt workspace (it only exists to be benchmarked).
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep insertion order, like JavaScript and Velt's `JsonValue`.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
codegen-units = 1
