[package]
name = "web-bench-axum"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the Velt workspace (it only exists to be benchmarked).
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[profile.release]
lto = "thin"
codegen-units = 1
