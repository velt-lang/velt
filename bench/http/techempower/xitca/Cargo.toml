[package]
name = "techempower-xitca"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of the repository workspace.
[workspace]

[dependencies]
xitca-web = { version = "=0.8.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
