[package]
name = "techempower-axum"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of the repository workspace.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
