[package]
name = "sqlite_rows_bench"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the Velt workspace (it only exists to be benchmarked).
[workspace]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The allocator of the Velt runtime.
mimalloc = { version = "0.1", default-features = false }

[profile.release]
codegen-units = 1
