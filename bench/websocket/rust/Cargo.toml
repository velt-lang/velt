[package]
name = "ws-bench-rust"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the Velt workspace (it only exists to be benchmarked).
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
