[package]
name = "db_bench"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the Velt workspace (it only exists to be benchmarked).
[workspace]

[dependencies]
# Same rusqlite (and so the same bundled SQLite) as the Velt runtime.
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
redis = { version = "1", default-features = false, features = ["tokio-comp", "aio"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

[profile.release]
codegen-units = 1
lto = true
