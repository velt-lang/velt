[package]
name = "stdport_bench"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not a member of the Velt workspace (it only exists to be benchmarked).
[workspace]

# The crates the runtime uses for the same job (crates/velt_rt/Cargo.toml), and `sha2` for what
# `velt/crypto` does in Velt.
[dependencies]
base64 = "0.22"
# `brotli` writes the inputs of `brotli_decode` (gen_inputs.rs) and is the port of the encoder rows.
brotli = "8"
brotli-decompressor = "6.0.1"
dashu-int = "0.6"
flate2 = "1"
# `os_random`: the OS generator, as the runtime drew it before it moved to std.
getrandom = "0.4"
hex = "0.4"
itoa = "1"
# `pow` (fdlibm), what the runtime called for `**` on floats before it moved to std.
libm = "0.2"
memchr = "2"
ryu = "1"
sha2 = "0.11"
url = "2"

[profile.release]
codegen-units = 1
